<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vega-Lite Stub</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    #vis { width: 600px; height: 400px; }
  </style>
</head>
<body>
  <h1>Vega-Lite Visualisation Stub</h1>
  <div id="vis"></div>
  <script>
    fetch('spec.json').then(r => r.json()).then(spec => {
      vegaEmbed('#vis', spec, {actions:false});
    });
  </script>
</body>
</html>
